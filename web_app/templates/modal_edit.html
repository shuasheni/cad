{% include 'header.html' %}

<div class="container-fluid py-4">

  <!-- 基础信息编辑 -->
<div class="card mb-4 shadow-sm">
  <div class="card-header bg-primary text-white">
    <h5 class="mb-0">1. 基础信息</h5>
  </div>
  <div class="card-body">
    <div class="row g-3">
      <!-- 规则ID -->
      <div class="col-md-4">
        <label for="rule-id" class="form-label">规则ID <span class="text-danger">*</span></label>
        <input
          type="text"
          class="form-control"
          id="rule-id"
          name="rule_id"
          placeholder="请输入规则id"
{#          readonly#}
          value="{{ rule_id if rule_id else '' }}">
{#        <div class="form-text text-muted">系统自动生成的唯一标识</div>#}
      </div>

      <!-- 结构名称 -->
      <div class="col-md-4">
        <label for="structure-name" class="form-label">结构名称 <span class="text-danger">*</span></label>
        <input
          type="text"
          class="form-control"
          id="structure-name"
          name="structure_name"
          placeholder="请输入结构名称"
          required
          maxlength="50">
        <div class="invalid-feedback">必须填写结构名称</div>
      </div>

      <!-- 分组选择 -->
      <div class="col-md-4">
        <label for="group-select" class="form-label">所属分组 <span class="text-danger">*</span></label>
        <select
          class="form-control"
          id="group-select"
          name="group"
          required>
          <option value="" disabled selected>请选择分组</option>
          <option value="default">无分组</option>
          {% for group in groups %}
          <option value="{{ group.id }}">{{ group.name }}</option>
          {% endfor %}
        </select>
        <div class="valid-feedback">选择有效</div>
      </div>

      <!-- 规则描述 -->
      <div class="col-md-10" style="margin-top: 5px">
        <label for="rule-desc" class="form-label">规则描述</label>

          <input
          type="text"
          class="form-control"
          id="structure-name"
          name="structure_name"
          placeholder="请输入规则描述..."
          required
          maxlength="50">
      </div>

        <!-- 操作 -->
      <div class="col-md-2">
          <label class="form-label">-</label>
          <div>
                <button class="btn btn-primary align-self-end" style="width: 100%" onclick="">
                  保存
                </button>
          </div>
      </div>
    </div>
  </div>
</div>

  <!-- 子图结构编辑 -->
  <div class="card mb-4 shadow-sm">
  <div class="card-header bg-info text-white">
    <h5 class="mb-0">2. 子图结构设计</h5>
  </div>
  <div class="card-body row">
    <!-- 节点配置区域 -->
    <div class="col-6">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h6>面配置</h6>
        <button class="btn btn-sm btn-success" onclick="addNode()">
          <i class="bi bi-plus-circle"></i> 添加节点
        </button>
      </div>

      <div id="node-list" class="row g-3">
        <!-- 动态生成的节点配置 -->
        <template id="node-template">
          <div class="col-lg-6 node-item">
            <div class="card border-primary mb-3">
              <div class="card-body">
                <div class="d-flex gap-2 mb-3">
                  <div>
                    <label class="form-label">面ID</label>
                    <input type="text" class="form-control node-id" style="width:80px" readonly>
                  </div>
                  <div class="flex-grow-1">
                    <label class="form-label">面类型</label>
                    <select class="form-control node-type">
                      <option value="any">任意</option>
                      <option value="plain">平面</option>
                      <option value="circle">圆柱面</option>
                      <option value="cone">圆锥面</option>
                      <option value="sphere">球面</option>
                      <option value="other">其他</option>
                    </select>
                  </div>
                    <div>
                        <label class="form-label">-</label>
                        <button class="btn btn-danger w-100" onclick="removeNode(this)">
                           删除
                        </button>
                    </div>
                </div>

              </div>
            </div>
          </div>
        </template>
      </div>
    </div>

    <!-- 边配置区域 -->
    <div class="border-left col-6">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h6>边配置</h6>
        <button class="btn btn-sm btn-success" onclick="addEdge()">
          <i class="bi bi-plus-circle"></i> 添加边
        </button>
      </div>

      <div id="edge-list">
        <!-- 动态生成的边配置 -->
        <template id="edge-template">
          <div class="edge-item card border-secondary mb-3">
            <div class="card-body">
              <div class="row g-3">
                <div class="col-md-3">
                  <label class="form-label">连接面A</label>
                  <select class="form-control edge-source">
                    <option value="">选择起点</option>
                  </select>
                </div>
                <div class="col-md-3">
                  <label class="form-label">连接面B</label>
                  <select class="form-control edge-target">
                    <option value="">选择终点</option>
                  </select>
                </div>
                <div class="col-md-4">
                  <label class="form-label">边类型</label>
                  <select class="form-control edge-type">
                    <option value="line">直线</option>
                    <option value="circle">圆（弧）</option>
                    <option value="other">其他</option>
                  </select>
                </div>
                <div class="col-md-2 d-flex align-items-end">
                  <button class="btn btn-danger" style="width: 100%" onclick="removeEdge(this)">
                    删除
                  </button>
                </div>
              </div>
            </div>
          </div>
        </template>
      </div>
    </div>
  </div>
</div>

  <!-- 额外条件编辑 -->
<div class="card mb-4 shadow-sm">
  <div class="card-header bg-success text-white">
    <h5 class="mb-0">3. 附加条件设置</h5>
  </div>
  <div class="card-body">
    <div id="condition-list">
      <template id="condition-template">
        <div class="condition-item border-bottom pb-3 mb-3">
          <div class="row g-2">
            <!-- 对象A配置 -->
            <div class="col-md-5">
              <div class="d-flex gap-2">
                <div class="flex-grow-1">
                  <label class="form-label">对象A</label>
                  <div class="input-group">
                    <select class="form-control obj-type" data-target="a">
                      <option value="node">面</option>
                      <option value="edge">边</option>
                    </select>
                    <input type="text" class="form-control obj-n1" placeholder="n1" data-target="a">
                    <input type="text" class="form-control obj-n2 d-none" placeholder="n2" data-target="a">
                    <select class="form-control obj-param" data-target="a">
                      <option value="axis">轴</option>
                      <option value="length">长度</option>
                      <option value="direction">方向</option>
                      <option value="radius">半径</option>
                    </select>
                  </div>
                </div>
              </div>
            </div>

            <!-- 条件运算符 -->
            <div class="col-md-1 align-items-center justify-content-center">
                <label class="form-label">判断条件</label>

                <div class="input-group">
                    <select class="form-control condition-func">
                        <option value="eq">等于</option>
                        <option value="neq">不等于</option>
                        <option value="gt">大于</option>
                        <option value="lt">小于</option>
                        <option value="parallel">平行于</option>
                        <option value="vertical">垂直于</option>
                        <option value="collinear">共线于</option>
                      </select>
                </div>

            </div>

            <!-- 对象B配置 -->
            <div class="col-md-5">
              <div class="d-flex gap-2">
                <div class="flex-grow-1">
                  <label class="form-label">对象B</label>
                  <div class="input-group">
                    <select class="form-control obj-type" data-target="b">
                      <option value="node">面</option>
                      <option value="edge">边</option>
                    </select>
                    <input type="text" class="form-control obj-n1" placeholder="n1" data-target="b">
                    <input type="text" class="form-control obj-n2 d-none" placeholder="n2" data-target="b">
                    <select class="form-control obj-param" data-target="b">
                      <option value="axis">轴</option>
                      <option value="length">长度</option>
                      <option value="direction">方向</option>
                      <option value="radius">半径</option>
                    </select>
                  </div>
                </div>
              </div>
            </div>

              <div class="col-md-1">

                  <label class="form-label">-</label>
                  <div>
                        <button class="btn btn-danger align-self-end" style="width: 100%" onclick="removeCondition(this)">
                          删除
                        </button>
                  </div>
              </div>
          </div>
        </div>
      </template>
    </div>

    <button class="btn btn-sm btn-success mt-2" onclick="addCondition()">
      <i class="bi bi-plus"></i> 添加条件
    </button>
  </div>
</div>

  <!-- 输出参数编辑 -->
<div class="card mb-4 shadow-sm">
  <div class="card-header bg-warning text-dark">
    <h5 class="mb-0">4. 输出参数设置</h5>
  </div>
  <div class="card-body">
    <div id="param-list">
      <template id="param-template">
        <div class="param-item border-bottom pb-3 mb-3">
          <div class="row g-2 align-items-center">
            <!-- 基础配置 -->
            <div class="col-md-3">
              <input type="text" class="form-control param-keyword" placeholder="参数关键词">
            </div>
            <div class="col-md-2">
              <select class="form-control param-type">
                <option value="face">面属性</option>
                <option value="edge">边属性</option>
                <option value="cal">计算参数</option>
              </select>
            </div>
            <!-- 动态配置区域 -->
            <div class="col-md-5">
              <!-- 面节点属性 -->
              <div class="param-config face-config">
                <div class="input-group">
                  <input type="text" class="form-control param-n1" placeholder="面ID">
                  <select class="form-control param-face-prop">
                    <option value="radius">半径</option>
                    <option value="axis">轴</option>
                    <option value="center">圆心</option>
                    <option value="direction">方向</option>
                  </select>
                </div>
              </div>

              <!-- 边属性 -->
              <div class="param-config edge-config d-none">
                <div class="input-group">
                  <input type="text" class="form-control param-n1" placeholder="连接面A">
                  <input type="text" class="form-control param-n2" placeholder="连接面B">
                  <select class="form-control param-edge-prop">
                    <option value="length">长度</option>
                    <option value="origin">原点</option>
                    <option value="direction">方向</option>
                  </select>
                </div>
              </div>

              <!-- 计算参数 -->
              <div class="param-config cal-config d-none">
                <div class="input-group">
                  <select class="form-control param-p1" placeholder="参数1"></select>
                  <select class="form-control param-p2" placeholder="参数2"></select>
                  <select class="form-control param-func">
                    <option value="dist">距离</option>
                    <option value="add">加</option>
                    <option value="sub">减</option>
                    <option value="mul">乘</option>
                  </select>
                </div>
              </div>
            </div>


            <div class="col-md-1">
              <div class="form-check">
                <input type="checkbox" class="form-check-input param-visible" checked>
                <label class="form-check-label">输出</label>
              </div>
            </div>

            <div class="col-md-1">
              <button class="btn btn-danger" style="width: 100%" onclick="removeParam(this)">删除
              </button>
            </div>
          </div>
        </div>
      </template>
    </div>

    <button class="btn btn-sm btn-warning mt-2" onclick="addParam()">
      <i class="bi bi-plus"></i> 添加参数
    </button>
  </div>
</div>

<!-- 节点分组模块 -->
<div class="card mb-4 shadow-sm">
  <div class="card-header bg-purple text-white">
    <h5 class="mb-0">5. 面分组</h5>
  </div>
  <div class="card-body">
    <div id="group-container" class="row g-3">
      <!-- 分组模板 -->
      <template id="group-template">
        <div class="group-item col-md-4">
          <div class="card border">
            <div class="card-header bg-light d-flex justify-content-between">
              <input type="text" class="form-control form-control-sm border-0 bg-transparent group-name"
                     style="width: auto; min-width: 100px" value="新分组">
              <button class="btn btn-sm btn-outline-danger" onclick="removeGroup(this)">
                删除
              </button>
            </div>
            <div class="card-body row node-list">
              <!-- 节点卡片动态插入 -->
            </div>
          </div>
        </div>
      </template>

      <!-- 默认分组 -->
      <div class="group-item col-md-4">
        <div class="card border-primary">
          <div class="card-header bg-primary text-white d-flex justify-content-between">
            <span>无分组</span>
          </div>
          <div class="card-body row node-list">
            <!-- 节点卡片动态插入 -->
            <template id="node-card-template">
              <div class="node-card card col-4" style="margin: 5px 0">
                <div class="card-body py-1 px-2 d-flex justify-content-between align-items-center">
                  <span class="node-id small">节点ID</span>
                  <div class="btn-group">
                    <button class="btn btn-xs btn-outline-secondary" onclick="moveGroup(this, 'prev')">
                      <i class="bi bi-arrow-left">←</i>
                    </button>
                    <button class="btn btn-xs btn-outline-secondary" onclick="moveGroup(this, 'next')">
                      <i class="bi bi-arrow-right">→</i>
                    </button>
                  </div>
                </div>
              </div>
            </template>
          </div>
        </div>
      </div>
    </div>

    <div class="mt-3">
      <button class="btn btn-primary btn-sm" onclick="addGroup()">
        <i class="bi bi-plus-circle"></i> 新建分组
      </button>
    </div>
  </div>
</div>


</div>



<script>

    // 节点计数器
    let nodeCounter = 0

    // 添加新节点
    function addNode() {
      const template = document.getElementById('node-template')
      const clone = template.content.cloneNode(true)
      const nodeIdInput = clone.querySelector('.node-id')
      nodeIdInput.value = `${nodeCounter++}`

      const nodeList = document.getElementById('node-list')
      nodeList.appendChild(clone)
      updateEdgeSelectors()
    }


    // 删除节点
    function removeNode(button) {
      const nodeItem = button.closest('.node-item')
      nodeItem.remove()
      updateEdgeSelectors()
    }

    // 更新边选择器的选项
    function updateEdgeSelectors() {
      const nodeIds = Array.from(document.querySelectorAll('.node-id')).map(input => input.value)
      const options = nodeIds.map(id => `<option value="${id}">${id}</option>`).join('')

      document.querySelectorAll('.edge-source, .edge-target').forEach(select => {
        const currentValue = select.value
        select.innerHTML = `<option value="">选择节点</option>${options}`
        select.value = currentValue
      })
    }

    // 添加新边
    function addEdge() {
      const template = document.getElementById('edge-template')
      const clone = template.content.cloneNode(true)
      document.getElementById('edge-list').appendChild(clone)
      updateEdgeSelectors()
    }

    // 删除边
    function removeEdge(button) {
      button.closest('.edge-item').remove()
    }

    // 初始化时添加第一个节点
    addNode()

        // 动态参数映射
    const paramOptions = {
      node: ['axis', 'radius', 'center'],
      edge: ['length', 'direction', 'slope']
    }

    function addCondition() {
      const template = document.getElementById('condition-template')
      const clone = template.content.cloneNode(true)

      // 初始化事件监听
      clone.querySelectorAll('.obj-type').forEach(select => {
        select.addEventListener('change', function() {
          updateParamOptions(this)
          toggleEdgeInputs(this)
        })
      })

      document.getElementById('condition-list').appendChild(clone)
    }

    function removeCondition(btn) {
      btn.closest('.condition-item').remove()
    }

    // 更新参数选项
    function updateParamOptions(select) {
      const target = select.dataset.target
      const type = select.value
      const paramSelect = select.closest('.input-group').querySelector('.obj-param')

      paramSelect.innerHTML = paramOptions[type].map(opt =>
        `<option value="${opt}">${opt}</option>`
      ).join('')
    }

    // 切换边输入框显示
    function toggleEdgeInputs(select) {
      const container = select.closest('.input-group')
      const n2Input = container.querySelector('.obj-n2')
      select.value === 'edge' ?
        n2Input.classList.remove('d-none') :
        n2Input.classList.add('d-none')
    }

    // 获取条件数据
    function getConditions() {
      return Array.from(document.querySelectorAll('.condition-item')).map(item => ({
        a: getObjConfig(item, 'a'),
        b: getObjConfig(item, 'b'),
        func: item.querySelector('.condition-func').value
      }))
    }

    // 获取对象配置
    function getObjConfig(item, target) {
      const container = item.querySelector(`[data-target="${target}"]`).closest('.input-group')
      const config = {
        param: container.querySelector('.obj-param').value
      }

      if (container.querySelector('.obj-type').value === 'node') {
        config.n1 = container.querySelector('.obj-n1').value
      } else {
        config.n1 = container.querySelector('.obj-n1').value
        config.n2 = container.querySelector('.obj-n2').value
      }

      return config
    }

    // 全局参数关键词列表
    let paramKeywords = []

    function addParam() {
      const template = document.getElementById('param-template')
      const clone = template.content.cloneNode(true)

      // 初始化类型切换
      const typeSelect = clone.querySelector('.param-type')
      typeSelect.addEventListener('change', function() {
        updateParamConfig(this)
        updateParamOptions()
      })

      // 初始化关键词输入
      clone.querySelector('.param-keyword').addEventListener('input', updateParamOptions)

      document.getElementById('param-list').appendChild(clone)
      updateParamOptions()
    }

    function removeParam(btn) {
      btn.closest('.param-item').remove()
      updateParamKeywords()
    }

    // 更新参数配置显示
    function updateParamConfig(select) {
      const container = select.closest('.param-item')
      const type = select.value

      container.querySelectorAll('.param-config').forEach(div => {
        div.classList.add('d-none')
      })
      container.querySelector(`.${type}-config`).classList.remove('d-none')
    }

    // 更新计算参数选项
    function updateParamOptions() {
      paramKeywords = Array.from(document.querySelectorAll('.param-keyword'))
        .map(input => input.value)
        .filter(v => v)

      document.querySelectorAll('.param-p1, .param-p2').forEach(select => {
        const currentValue = select.value
        select.innerHTML = paramKeywords.map(k =>
          `<option value="${k}" ${k === currentValue ? 'selected' : ''}>${k}</option>`
        ).join('')
      })
    }

    // 获取参数数据
    function getParams() {
      return Array.from(document.querySelectorAll('.param-item')).map(item => {
        const base = {
          keyword: item.querySelector('.param-keyword').value,
          type: item.querySelector('.param-type').value,
          visible: item.querySelector('.param-visible').checked
        }

        switch(base.type) {
          case 'face':
            return {
              ...base,
              n1: item.querySelector('.param-n1').value,
              param: item.querySelector('.param-face-prop').value
            }
          case 'edge':
            return {
              ...base,
              n1: item.querySelector('.param-n1').value,
              n2: item.querySelector('.param-n2').value,
              param: item.querySelector('.param-edge-prop').value
            }
          case 'cal':
            return {
              ...base,
              p1: item.querySelector('.param-p1').value,
              p2: item.querySelector('.param-p2').value,
              func: item.querySelector('.param-func').value
            }
        }
      })
    }

    // 初始化数据
    let groups = []
    let allNodes = [0, 1, 2, 3, 4, 5, 6] // 初始节点列表

    // 初始化默认分组
    function initDefaultGroup() {
      const defaultGroup = document.querySelector('#group-container > .group-item')
      allNodes.forEach(nodeId => {
        createNodeCard(nodeId, defaultGroup.querySelector('.node-list'))
      })
    }

    // 创建节点卡片
    function createNodeCard(nodeId, container) {
      const template = document.getElementById('node-card-template')
      const clone = template.content.cloneNode(true)
      const card = clone.querySelector('.node-card')
      card.querySelector('.node-id').textContent = `面${nodeId}`
      card.dataset.nodeId = nodeId
      container.appendChild(clone)
    }

    // 移动节点到相邻分组
    function moveGroup(btn, direction) {
      const card = btn.closest('.node-card')
      const currentGroup = card.closest('.group-item')
      const allGroups = Array.from(document.querySelectorAll('.group-item:not(:first-child)'))

      // 排除默认分组
      const editableGroups = allGroups.slice(1)
      const currentIndex = editableGroups.indexOf(currentGroup)

      // 计算目标分组索引
      let targetIndex = direction === 'prev' ? currentIndex - 1 : currentIndex + 1
      if (targetIndex < 0) targetIndex = editableGroups.length - 1
      if (targetIndex >= editableGroups.length) targetIndex = 0

      const targetGroup = editableGroups[targetIndex]?.querySelector('.node-list')
                        || editableGroups[0]?.querySelector('.node-list')

      if (targetGroup) {
        targetGroup.appendChild(card)
      }
    }

    // 添加新分组
    function addGroup() {
      const template = document.getElementById('group-template')
      const clone = template.content.cloneNode(true)
      document.getElementById('group-container').appendChild(clone)
    }

    // 删除分组
    function removeGroup(btn) {
      const groupItem = btn.closest('.group-item')
      // 将节点移回默认分组
      const defaultList = document.querySelector('.group-item:first-child .node-list')
      Array.from(groupItem.querySelectorAll('.node-card')).forEach(card => {
        defaultList.appendChild(card)
      })
      groupItem.remove()
    }

    // 初始化
    document.addEventListener('DOMContentLoaded', initDefaultGroup)

</script>

<style>

  background-color: #f8f9fa;
}
.edge-type option {
  background: #fff;
}
.condition-item .input-group {
  flex-wrap: nowrap;
}
.condition-item .form-control {
  min-width: 80px;
}
.obj-n1, .obj-n2 {
  max-width: 60px;
}

.param-config .input-group {
  flex-wrap: nowrap;
}
.param-config input,
.param-config select {
  min-width: 120px;
}
.param-n1, .param-n2 {
  max-width: 80px;
}

.bg-purple {
  background-color: #6f42c1 !important;
}

.group-nodes option:checked {
  background-color: #007bff;
  color: white;
}

.bg-purple {
  background-color: #6f42c1 !important;
}

.form-control-color {
  height: 38px;
  padding: 2px;
}

.group-item {
  min-width: 200px;
}
.node-list {
  min-height: 60px;
